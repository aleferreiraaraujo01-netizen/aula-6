<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Estudo de Classes</title>

    <style>
        .titulo {
            background-color: blue;
            border: 2PX SOLID darkblue;
            border-radius: 15px;
            padding: 20px;
            margin: 20px;
        }

        .paragrafos {
            background-color:blueviolet;
            border: 2PX SOLID rgba(185, 25, 151, 0);
            border-radius: 15px;
            padding: 20px;
            margin: 20px;
        }

        .destaque {
            color:chartreuse;
            background-color: cornsilk;
            font-style: oblique;
            padding: 10px;

    </style>
</head>

<body>

    <h1 class="titulo">Aprendendo Classes com CSS</h1>

    <div class="paragrafos">
        <p>Este é o primeiro parágrafo da primeira div.</p>
        <p>Este é o segundo parágrafo da primeira div.</p>
    </div>

    <div class="destaque">
        <p>Este é o único parágrafo da segunda div.</p>
    </div>

</body>
</html>
